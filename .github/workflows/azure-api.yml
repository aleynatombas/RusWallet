name: Deploy API to Azure

# Push tetikleyicisi kaldırıldı: main_ruswallet-api-aleyna.yml (Azure Deployment Center'ın
# OIDC tabanlı resmi workflow'u) aynı App Service'e aynı push olayında deploy ediyor.
# İkisi birlikte her main push'unda çakışırdı; bu workflow artık yalnızca elle tetiklenir.
on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: |
          dotnet publish backend/RusWallet.API/RusWallet.API.csproj -c Release -o ./api-publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./api-publish
