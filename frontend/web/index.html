<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=7" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=7" />
    <link rel="apple-touch-icon" href="/favicon-192.png?v=7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RusWallet</title>
    <!-- İlk boyama: tercih yoksa aydınlık; kayıtlı 'dark' ise koyu (FOUC azaltır). -->
    <script>
      try {
        var th = localStorage.getItem('ruswallet-theme');
        if (th === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
